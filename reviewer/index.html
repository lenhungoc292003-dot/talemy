<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Talemy Reviewer Center cho kết quả, transcript và reasoning chấm điểm.">
  <meta name="theme-color" content="#050505">
  <title>Talemy · Reviewer Center</title>
  <style>@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap');

:root {
  --black: #050505;
  --black-2: #0b0b0b;
  --black-3: #121212;
  --surface: #161616;
  --line: #2b2b2b;
  --line-soft: #222;
  --orange: #ff7426;
  --orange-soft: rgba(255, 116, 38, 0.14);
  --cream: #fff9f4;
  --white: #f7f5f2;
  --muted: #a5a09b;
  --green: #59d493;
  --red: #ff7b68;
  --shadow: 0 22px 70px rgba(0, 0, 0, 0.42);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  color: var(--white);
  background:
    radial-gradient(900px 540px at 0% -10%, rgba(255, 116, 38, 0.11), transparent 62%),
    var(--black);
  font-family: "DM Sans", Arial, sans-serif;
  min-height: 100vh;
}
button, input, select, textarea { font: inherit; }
button, a { -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; }
a { color: inherit; text-decoration: none; }

.site-shell,
.assessment-shell { width: min(1180px, calc(100% - 36px)); margin: 0 auto; }
.main-header,
.assessment-header {
  height: 92px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  border-bottom: 1px solid var(--line-soft);
}
.main-header nav { display: flex; gap: 26px; color: var(--muted); font-size: 13px; }
.main-header nav a:hover { color: var(--orange); }
.logo-lockup { display: flex; align-items: center; gap: 14px; min-width: 0; }
.logo-lockup img { width: 156px; height: 48px; object-fit: contain; object-position: left center; }
.logo-lockup span { color: var(--muted); padding-left: 14px; border-left: 1px solid var(--line); text-transform: uppercase; letter-spacing: .09em; font-size: 10px; font-weight: 700; white-space: nowrap; }
.logo-lockup.compact img { width: 132px; height: 40px; }
.assessment-header > div:last-child { display: grid; text-align: right; gap: 3px; }
.assessment-header > div:last-child span { color: var(--orange); font-size: 10px; letter-spacing: .12em; font-weight: 800; }
.assessment-header > div:last-child strong { font-size: 13px; }

.eyebrow { margin: 0; color: var(--muted); font-size: 10px; line-height: 1.3; letter-spacing: .14em; text-transform: uppercase; font-weight: 800; }
.eyebrow.orange { color: var(--orange); }
.landing-hero { min-height: 680px; padding: 84px 0 74px; display: grid; grid-template-columns: 1.25fr .75fr; gap: 72px; align-items: center; }
.hero-copy h1 { margin: 18px 0 24px; font-family: Manrope, sans-serif; font-size: clamp(48px, 6vw, 78px); line-height: .99; letter-spacing: -.06em; max-width: 810px; }
.hero-copy h1 span { color: var(--orange); }
.hero-lead { color: var(--muted); font-size: 18px; line-height: 1.7; max-width: 720px; }
.hero-facts { display: flex; gap: 48px; margin-top: 42px; }
.hero-facts div { display: grid; gap: 4px; }
.hero-facts strong { font-family: Manrope, sans-serif; font-size: 28px; }
.hero-facts span { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; }

.candidate-card { background: var(--surface); border: 1px solid #333; border-radius: 22px; padding: 30px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
.candidate-card::before { content: ""; position: absolute; width: 220px; height: 220px; right: -110px; top: -110px; border-radius: 50%; background: var(--orange); opacity: .09; }
.card-label { color: var(--muted); font-size: 10px; letter-spacing: .11em; font-weight: 800; display: flex; align-items: center; gap: 8px; }
.card-label i { width: 7px; height: 7px; background: var(--orange); border-radius: 50%; box-shadow: 0 0 0 5px var(--orange-soft); }
.candidate-card h2 { font: 700 26px/1.2 Manrope, sans-serif; margin: 22px 0 7px; }
.candidate-card > p { color: var(--muted); font-size: 13px; line-height: 1.6; margin: 0 0 22px; }
label { display: grid; gap: 8px; font-size: 12px; font-weight: 700; margin-top: 15px; }
input, select, textarea { width: 100%; border: 1px solid var(--line); background: #0d0d0d; color: var(--white); border-radius: 10px; padding: 13px 14px; outline: none; transition: border .15s, box-shadow .15s; }
input:focus, select:focus, textarea:focus { border-color: var(--orange); box-shadow: 0 0 0 3px var(--orange-soft); }
select { appearance: auto; }
textarea { resize: vertical; line-height: 1.6; }
.two-inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.primary-button, .secondary-button { border: 0; border-radius: 10px; min-height: 48px; padding: 0 19px; display: inline-flex; align-items: center; justify-content: center; gap: 22px; font-weight: 800; font-size: 13px; transition: transform .15s, filter .15s, border .15s; }
.primary-button { background: var(--orange); color: #160900; }
.primary-button:hover { filter: brightness(1.08); transform: translateY(-1px); }
.primary-button:disabled { opacity: .4; cursor: not-allowed; transform: none; }
.secondary-button { background: transparent; border: 1px solid var(--line); color: var(--white); }
.secondary-button:hover { border-color: #555; }
.candidate-card .primary-button { width: 100%; margin-top: 22px; }
.privacy-line { margin: 13px 0 0 !important; text-align: center; font-size: 10px !important; }
.form-error { margin: 14px 0 0; color: #ff9c8e; background: rgba(255, 123, 104, .09); border: 1px solid rgba(255, 123, 104, .25); padding: 11px 13px; border-radius: 9px; font-size: 12px; line-height: 1.5; }

.journey { border-top: 1px solid var(--line-soft); padding: 64px 0 90px; display: grid; grid-template-columns: 1fr 62px 1fr; align-items: stretch; }
.journey article { position: relative; min-height: 260px; border: 1px solid var(--line); background: var(--black-2); border-radius: 18px; padding: 34px; overflow: hidden; }
.journey article.accent-card { border-color: rgba(255,116,38,.42); }
.round-number { position: absolute; right: 22px; top: 8px; font: 800 80px/1 Manrope; color: rgba(255,255,255,.035); }
.journey h2 { margin: 13px 0 11px; font: 700 27px/1.2 Manrope; }
.journey article > p:not(.eyebrow) { color: var(--muted); max-width: 440px; line-height: 1.65; }
.journey-arrow { display: grid; place-items: center; color: var(--orange); font-size: 22px; }
.time-chip { display: inline-block; margin-top: 13px; border: 1px solid var(--line); border-radius: 999px; padding: 7px 10px; color: var(--muted); font-size: 10px; }

.round-progress { height: 3px; background: var(--line-soft); }
.round-progress span { display: block; height: 100%; background: var(--orange); transition: width .4s ease; }
.round-title-block { padding: 55px 0 35px; max-width: 720px; }
.round-title-block h1, .rubric-hero h1, .task-column > h1 { font: 800 clamp(34px, 5vw, 54px)/1.04 Manrope; letter-spacing: -.045em; margin: 12px 0 14px; }
.round-title-block > p:last-child, .rubric-hero > div > p:last-child, .task-lead { color: var(--muted); font-size: 16px; line-height: 1.65; }
.round1-frame-wrap { background: var(--black-2); border: 1px solid var(--line); border-radius: 20px; padding: 14px; box-shadow: var(--shadow); overflow: hidden; }
.round1-frame-wrap iframe { width: 100%; border: 0; display: block; transition: height .25s ease; }
.unlock-card { margin: 24px 0 90px; border-radius: 18px; padding: 25px 28px; display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 22px; }
.unlock-card.unlocked { border: 1px solid rgba(89,212,147,.35); background: rgba(89,212,147,.08); }
.unlock-card.locked { border: 1px solid rgba(255,123,104,.3); background: rgba(255,123,104,.07); }
.unlock-icon { width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%; background: #111; color: var(--orange); font-weight: 800; font-size: 20px; }
.unlock-card h2 { margin: 5px 0; font: 700 20px/1.3 Manrope; }
.unlock-card p:not(.eyebrow) { color: var(--muted); margin: 0; font-size: 13px; }

.rubric-page { padding-bottom: 90px; }
.rubric-hero { padding: 80px 0 42px; display: flex; justify-content: space-between; align-items: end; gap: 40px; }
.rubric-hero > div:first-child { max-width: 760px; }
.rubric-note { border-left: 1px solid var(--line); padding-left: 26px; display: grid; gap: 4px; min-width: 180px; }
.rubric-note strong { font: 800 30px/1 Manrope; color: var(--orange); }
.rubric-note span { color: var(--muted); font-size: 11px; }
.rubric-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.rubric-grid article { min-height: 260px; padding: 28px; background: var(--surface); border: 1px solid var(--line); border-radius: 17px; }
.rubric-grid article > span { color: var(--orange); font: 700 11px/1 Manrope; }
.rubric-grid h2 { margin: 44px 0 7px; font: 800 24px/1.15 Manrope; }
.rubric-grid strong { font-size: 13px; }
.rubric-grid p { color: var(--muted); line-height: 1.6; font-size: 13px; }
.case-preview { margin-top: 18px; padding: 28px 32px; display: grid; grid-template-columns: .8fr 1.2fr; gap: 48px; align-items: center; border: 1px solid rgba(255,116,38,.32); border-radius: 17px; background: linear-gradient(90deg, rgba(255,116,38,.11), rgba(255,116,38,.025)); }
.case-preview h2 { font: 700 21px/1.25 Manrope; margin: 7px 0 0; }
.case-preview ul { margin: 0; padding-left: 18px; color: #cec8c2; font-size: 13px; line-height: 1.8; }
.center-action { display: flex; justify-content: center; margin-top: 34px; }
.rubric-disclaimer { text-align: center; color: var(--muted); font-size: 11px; margin-top: 18px; }

.round2-shell { padding-bottom: 90px; }
.round2-topline { height: 78px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line-soft); }
.round2-topline > span { color: var(--muted); font-size: 10px; letter-spacing: .12em; font-weight: 800; }
.step-dots { display: flex; align-items: center; gap: 8px; }
.step-dots span { width: 25px; height: 25px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line); color: var(--muted); font-size: 10px; }
.step-dots span.active { background: var(--orange); border-color: var(--orange); color: #160900; font-weight: 800; }
.round2-layout { display: grid; grid-template-columns: minmax(0, 1fr) 390px; gap: 24px; padding-top: 34px; align-items: start; }
.task-column { min-width: 0; background: var(--black-2); border: 1px solid var(--line); border-radius: 19px; padding: 38px; }
.task-column > h1 { font-size: clamp(34px, 4.5vw, 48px); }
.task-lead { max-width: 720px; margin-bottom: 28px; }
.delegation-list { display: grid; gap: 10px; }
.delegation-list article { padding: 20px; background: var(--black-3); border: 1px solid var(--line); border-radius: 13px; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 18px; }
.delegation-list article > div:first-child { display: grid; grid-template-columns: 28px 1fr; column-gap: 10px; align-items: start; }
.delegation-list article > div:first-child > span { color: var(--orange); font-size: 10px; font-weight: 800; margin-top: 3px; }
.delegation-list h2 { grid-column: 2; margin: 0; font-size: 15px; line-height: 1.4; }
.delegation-list p { grid-column: 2; margin: 6px 0 0; color: var(--muted); font-size: 11px; line-height: 1.5; }
.choice-segment { display: flex; gap: 4px; background: #090909; padding: 4px; border-radius: 9px; }
.choice-segment button { color: var(--muted); border: 0; background: transparent; border-radius: 7px; padding: 10px 11px; font-size: 10px; font-weight: 700; white-space: nowrap; }
.choice-segment button.active { background: var(--orange); color: #160900; }
.source-card { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.source-title { background: var(--orange-soft); padding: 15px 18px; display: flex; justify-content: space-between; gap: 15px; }
.source-title span { color: var(--orange); font-size: 10px; letter-spacing: .12em; font-weight: 800; }
.source-title strong { font-size: 12px; }
.source-card dl { margin: 0; display: grid; grid-template-columns: 1fr 1fr; }
.source-card dl div { padding: 18px; border-top: 1px solid var(--line); display: grid; gap: 5px; }
.source-card dl div:nth-child(odd) { border-right: 1px solid var(--line); }
.source-card dt { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
.source-card dd { margin: 0; font-size: 13px; font-weight: 700; }
.simple-instructions { margin-top: 18px; padding: 20px; background: #0d0d0d; border-radius: 13px; }
.simple-instructions strong { font-size: 13px; }
.simple-instructions ol { color: var(--muted); font-size: 12px; line-height: 1.9; padding-left: 20px; margin-bottom: 0; }
.draft-ready { display: flex; align-items: center; gap: 12px; margin-top: 15px; border: 1px solid rgba(89,212,147,.28); background: rgba(89,212,147,.08); padding: 15px; border-radius: 12px; }
.draft-ready > span { width: 28px; height: 28px; display: grid; place-items: center; background: var(--green); color: #04140c; border-radius: 50%; font-weight: 800; }
.draft-ready strong { font-size: 12px; }
.draft-ready p { margin: 2px 0 0; color: var(--muted); font-size: 11px; }
.draft-card { background: #0d0d0d; border: 1px solid var(--line); border-radius: 14px; padding: 22px; }
.draft-card > span { color: var(--orange); font-size: 10px; letter-spacing: .12em; font-weight: 800; }
.draft-card pre { margin: 16px 0 0; white-space: pre-wrap; font: 12px/1.75 "DM Sans", sans-serif; color: #d6d0ca; }
.audit-list { display: grid; gap: 9px; margin-top: 16px; }
.audit-list button { width: 100%; background: var(--black-3); color: var(--white); border: 1px solid var(--line); border-radius: 11px; padding: 15px; display: flex; align-items: flex-start; gap: 12px; text-align: left; line-height: 1.5; font-size: 12px; }
.audit-list button i { width: 20px; height: 20px; flex: 0 0 20px; border: 1px solid #484848; border-radius: 5px; display: grid; place-items: center; font-style: normal; color: #160900; }
.audit-list button.selected { border-color: var(--orange); background: var(--orange-soft); }
.audit-list button.selected i { background: var(--orange); border-color: var(--orange); }
.revision-field { margin-top: 22px; }
.revision-field > span { text-align: right; color: var(--muted); font-size: 10px; font-weight: 500; }
.task-actions { display: flex; justify-content: space-between; margin-top: 28px; padding-top: 23px; border-top: 1px solid var(--line-soft); }

.ai-chat { position: sticky; top: 18px; border: 1px solid #333; background: var(--surface); border-radius: 19px; overflow: hidden; box-shadow: var(--shadow); }
.chat-head { padding: 17px 18px; display: flex; gap: 11px; align-items: center; border-bottom: 1px solid var(--line); }
.ai-avatar { width: 37px; height: 37px; display: grid; place-items: center; border-radius: 11px; background: var(--orange); color: #160900; font: 800 11px/1 Manrope; flex: 0 0 auto; }
.chat-head > div:last-child { display: grid; gap: 3px; }
.chat-head strong { font-size: 13px; }
.chat-head span { color: var(--muted); font-size: 10px; }
.chat-head i { display: inline-block; width: 6px; height: 6px; background: var(--green); border-radius: 50%; margin-right: 5px; }
.chat-context { padding: 11px 18px; background: var(--orange-soft); display: flex; justify-content: space-between; gap: 10px; font-size: 10px; }
.chat-context strong { color: var(--orange); text-transform: uppercase; letter-spacing: .08em; }
.chat-context span { color: #d1c7bf; }
.chat-messages { height: 410px; overflow-y: auto; padding: 17px; display: flex; flex-direction: column; gap: 12px; }
.chat-message { max-width: 92%; }
.chat-message.user { align-self: flex-end; }
.chat-message > span { display: block; color: var(--muted); font-size: 9px; margin: 0 0 4px 4px; }
.chat-message p { margin: 0; white-space: pre-wrap; border-radius: 12px 12px 12px 3px; background: #222; padding: 11px 12px; font-size: 11px; line-height: 1.55; }
.chat-message.user p { background: var(--orange); color: #160900; border-radius: 12px 12px 3px 12px; }
.chat-compose { padding: 12px; border-top: 1px solid var(--line); }
.chat-compose textarea { min-height: 88px; background: #0c0c0c; font-size: 11px; }
.chat-compose > div { display: flex; justify-content: space-between; align-items: center; margin-top: 7px; }
.chat-compose > div span { color: var(--muted); font-size: 9px; }
.chat-compose button { border: 0; border-radius: 7px; background: var(--orange); color: #160900; padding: 8px 12px; font-size: 10px; font-weight: 800; }
.chat-compose button:disabled { opacity: .4; cursor: not-allowed; }
.chat-note { color: var(--muted); font-size: 9px; line-height: 1.5; margin: 0; padding: 0 13px 13px; text-align: center; }

.results-page { padding-bottom: 80px; }
.result-hero { min-height: 330px; padding: 55px 0; display: flex; align-items: center; justify-content: space-between; gap: 50px; border-bottom: 1px solid var(--line-soft); }
.result-hero h1 { font: 800 clamp(43px, 6vw, 70px)/1 Manrope; letter-spacing: -.055em; margin: 14px 0 10px; }
.result-hero > div:first-child > p:not(.eyebrow) { color: var(--muted); }
.result-chips { display: flex; gap: 8px; margin-top: 20px; }
.result-chips span { border: 1px solid var(--line); border-radius: 999px; color: var(--muted); padding: 7px 10px; font-size: 10px; }
.overall-score { display: flex; align-items: center; gap: 20px; max-width: 390px; }
.overall-score > div:last-child { display: grid; gap: 4px; }
.overall-score > div:last-child span { color: var(--orange); font-size: 10px; letter-spacing: .1em; font-weight: 800; }
.overall-score > div:last-child strong { font: 800 22px/1.2 Manrope; }
.overall-score p { color: var(--muted); line-height: 1.5; font-size: 11px; margin: 0; }
.score-ring { width: 120px; height: 120px; flex: 0 0 120px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--orange) var(--score), var(--line) 0); position: relative; }
.score-ring::after { content: ""; position: absolute; inset: 9px; border-radius: 50%; background: var(--black); }
.score-ring > div { z-index: 1; display: flex; align-items: baseline; }
.score-ring strong { font: 800 31px/1 Manrope; }
.score-ring span { color: var(--muted); font-size: 10px; }
.score-ring.small { width: 68px; height: 68px; flex-basis: 68px; }
.score-ring.small::after { inset: 6px; background: var(--surface); }
.score-ring.small strong { font-size: 20px; }
.score-ring.small span { font-size: 8px; }
.round-summary-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; padding: 34px 0; }
.round-summary-grid article { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 27px; }
.round-summary-grid article.orange-card { border-color: rgba(255,116,38,.4); background: linear-gradient(120deg, rgba(255,116,38,.14), var(--surface)); }
.round-summary-grid h2 { margin: 22px 0 4px; font: 800 38px/1 Manrope; }
.round-summary-grid strong { font-size: 12px; }
.round-summary-grid article > p:last-child { color: var(--muted); font-size: 12px; line-height: 1.55; }
.result-section-head { padding: 58px 0 23px; display: flex; justify-content: space-between; align-items: end; gap: 30px; }
.result-section-head h2 { font: 800 30px/1.2 Manrope; margin: 9px 0 0; }
.result-section-head > p { max-width: 390px; color: var(--muted); font-size: 12px; line-height: 1.6; }
.score-architecture {
  margin-top: 18px;
  padding: 28px;
  border: 1px solid var(--line);
  border-radius: 17px;
  background: var(--black-2);
}
.score-architecture-head {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 24px;
  margin-bottom: 19px;
}
.score-architecture-head h2 { margin: 7px 0 0; font: 800 24px/1.2 Manrope; }
.score-architecture-head > p { max-width: 390px; margin: 0; color: var(--muted); font-size: 11px; line-height: 1.6; }
.score-matrix-wrap { overflow-x: auto; }
.score-matrix { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.score-matrix th, .score-matrix td { padding: 12px 14px; border-bottom: 1px solid var(--line); text-align: right; font-size: 10px; }
.score-matrix th:first-child, .score-matrix td:first-child { text-align: left; }
.score-matrix thead th { color: var(--muted); font-size: 8px; text-transform: uppercase; letter-spacing: .08em; }
.score-matrix tbody th { color: #ded7d0; }
.score-matrix tbody td { color: var(--muted); }
.score-matrix tbody td:last-child strong { color: var(--orange); font-size: 13px; }
.band-scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin-top: 15px; }
.band-scale span { padding: 8px; border-radius: 7px; background: #101010; color: var(--muted); text-align: center; font-size: 8px; }
.band-scale span:last-child { color: #f2c7ae; background: var(--orange-soft); }
.executive-insights { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 22px; }
.executive-insights article { padding: 18px; border: 1px solid var(--line); border-radius: 13px; background: #101010; }
.executive-insights article.positive { border-color: rgba(89,212,147,.28); }
.executive-insights article.priority { border-color: rgba(255,123,104,.28); }
.executive-insights span { display: block; color: var(--muted); font-size: 8px; font-weight: 800; letter-spacing: .09em; }
.executive-insights strong { display: block; margin-top: 8px; font: 800 16px/1.25 Manrope; }
.executive-insights .positive strong { color: var(--green); }
.executive-insights .priority strong { color: #ff9d90; }
.executive-insights p { margin: 8px 0 0; color: var(--muted); font-size: 10px; line-height: 1.55; }
.strength-results { display: grid; grid-template-columns: repeat(3, 1fr); gap: 13px; }
.strength-results > article { background: var(--surface); border: 1px solid var(--line); border-radius: 17px; padding: 22px; }
.strength-head { display: grid; grid-template-columns: 25px 1fr auto; align-items: center; gap: 8px; }
.strength-head > span { align-self: start; color: var(--orange); font-size: 10px; font-weight: 800; }
.strength-head h3 { margin: 0; font: 800 19px/1.2 Manrope; }
.strength-head p { color: var(--muted); font-size: 10px; margin: 4px 0 0; }
.band-row { margin: 18px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 12px 0; display: flex; justify-content: space-between; font-size: 10px; }
.band-row span { color: var(--muted); }
.band-row strong { color: var(--orange); }
.feedback { margin-top: 17px; }
.feedback h4 { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; margin: 0 0 10px; }
.feedback.good h4 { color: var(--green); }
.feedback.improve h4 { color: var(--red); }
.feedback ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 7px; }
.feedback li { color: var(--muted); font-size: 11px; line-height: 1.5; padding-left: 14px; position: relative; }
.feedback li::before { position: absolute; left: 0; }
.feedback.good li::before { content: "✓"; color: var(--green); }
.feedback.improve li::before { content: "△"; color: var(--red); }
.grader-note { margin-top: 24px; padding: 28px; display: grid; grid-template-columns: auto 1fr; gap: 18px; border: 1px solid rgba(255,116,38,.35); background: var(--orange-soft); border-radius: 17px; }
.grader-note h2 { margin: 5px 0 8px; font: 800 22px/1.2 Manrope; }
.grader-note p:last-child { color: #cfc5bd; font-size: 12px; line-height: 1.65; margin: 0; }
.result-footer { margin-top: 28px; padding-top: 24px; border-top: 1px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 25px; }
.result-footer > div:first-child { display: grid; gap: 4px; }
.result-footer > div:first-child strong { color: var(--green); font-size: 12px; }
.result-footer > div:first-child span { color: var(--muted); font-size: 10px; }
.result-footer > div:last-child { display: flex; gap: 9px; }

.reviewer-page { width: min(1380px, calc(100% - 34px)); margin: 0 auto; padding-bottom: 70px; }
.reviewer-login-page { width: min(1080px, calc(100% - 34px)); min-height: 100vh; margin: 0 auto; }
.reviewer-login-page > .reviewer-header > a { color: var(--muted); font-size: 10px; text-decoration: none; }
.reviewer-login-card { width: min(100%, 460px); margin: clamp(70px, 12vh, 130px) auto 40px; padding: 36px; background: var(--black-2); border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 24px 70px rgba(0,0,0,.28); }
.reviewer-login-icon { width: 48px; height: 48px; display: grid; place-items: center; margin-bottom: 24px; border-radius: 14px; background: var(--orange); color: var(--black); font: 800 20px/1 Manrope; }
.reviewer-login-card h1 { margin: 8px 0 10px; font: 800 34px/1.08 Manrope; letter-spacing: -.04em; }
.reviewer-login-card > p:not(.eyebrow) { color: var(--muted); font-size: 12px; line-height: 1.65; }
.reviewer-login-card form { display: grid; gap: 14px; margin-top: 24px; }
.reviewer-login-card label { display: grid; gap: 8px; color: #d8d1ca; font-size: 10px; font-weight: 700; }
.reviewer-login-card input { width: 100%; min-height: 48px; padding: 0 14px; border: 1px solid var(--line); border-radius: 10px; background: #101010; color: var(--white); outline: none; }
.reviewer-login-card input:focus { border-color: var(--orange); box-shadow: 0 0 0 3px rgba(255,116,38,.12); }
.reviewer-login-card .primary-button { width: 100%; justify-content: center; }
.reviewer-login-card small { display: block; margin-top: 16px; color: var(--muted); font-size: 9px; line-height: 1.55; }
.reviewer-header { height: 82px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line-soft); }
.reviewer-brand { display: flex; align-items: center; gap: 14px; }
.reviewer-brand img { width: 132px; height: 42px; object-fit: contain; object-position: left center; }
.reviewer-brand > span { border-left: 1px solid var(--line); padding-left: 14px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .09em; }
.reviewer-header > div:last-child { display: flex; align-items: center; gap: 11px; font-size: 10px; }
.reviewer-header > div:last-child > span { color: var(--muted); }
.reviewer-header > div:last-child a, .reviewer-header > div:last-child button { color: var(--orange); padding-left: 12px; border: 0; border-left: 1px solid var(--line); background: transparent; cursor: pointer; font: inherit; }
.reviewer-title { padding: 48px 0 32px; display: flex; justify-content: space-between; align-items: end; gap: 30px; }
.reviewer-title h1 { margin: 8px 0; font: 800 42px/1.1 Manrope; letter-spacing: -.04em; }
.reviewer-title > div:first-child > p:last-child { color: var(--muted); font-size: 13px; }
.reviewer-count { display: grid; text-align: right; }
.reviewer-count strong { font: 800 37px/1 Manrope; color: var(--orange); }
.reviewer-count span { color: var(--muted); font-size: 10px; }
.reviewer-methodology {
  margin: 0 0 18px;
  padding: 18px;
  border: 1px solid rgba(255,116,38,.3);
  border-radius: 14px;
  background: linear-gradient(135deg, rgba(255,116,38,.1), #0d0d0d);
}
.reviewer-methodology > summary { cursor: pointer; color: #f0d0bd; font-size: 11px; font-weight: 800; }
.reviewer-methodology-grid { display: grid; grid-template-columns: .9fr 1.1fr; gap: 16px; margin-top: 18px; }
.reviewer-methodology h3 { margin: 0 0 10px; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
.reviewer-methodology ol { margin: 0; padding-left: 19px; color: var(--muted); font-size: 9px; line-height: 1.65; }
.reviewer-band-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.reviewer-band-grid > div { padding: 9px; display: grid; gap: 4px; background: #101010; border-radius: 7px; }
.reviewer-band-grid strong { color: var(--orange); font-size: 8px; }
.reviewer-band-grid span { color: var(--white); font-size: 10px; font-weight: 800; }
.reviewer-band-grid small { color: var(--muted); font-size: 7px; line-height: 1.4; }
.reviewer-criteria-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 13px; }
.reviewer-criteria-grid section { padding: 12px; border: 1px solid var(--line); border-radius: 9px; background: #0d0d0d; }
.reviewer-criteria-grid section > div { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-top: 1px solid rgba(255,255,255,.05); font-size: 8px; }
.reviewer-criteria-grid section > div span { color: var(--muted); }
.reviewer-criteria-grid section > div strong { color: #e2b397; white-space: nowrap; }
.reviewer-layout { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 16px; align-items: start; }
.submission-list, .reviewer-detail { background: var(--black-2); border: 1px solid var(--line); border-radius: 17px; }
.submission-list { padding: 15px; position: sticky; top: 15px; }
.submission-list label { margin: 0 0 12px; }
.submission-list input { padding: 11px 12px; font-size: 11px; }
.submission-list > div { display: grid; gap: 6px; max-height: 720px; overflow-y: auto; }
.submission-list button { display: grid; grid-template-columns: 35px 1fr auto; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 12px; border: 1px solid transparent; background: #101010; color: var(--white); border-radius: 10px; }
.submission-list button.active { border-color: var(--orange); background: var(--orange-soft); }
.candidate-initial { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: #242424; color: var(--orange); font-weight: 800; }
.submission-list button > span:nth-child(2) { min-width: 0; display: grid; gap: 3px; }
.submission-list button strong { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.submission-list button small { color: var(--muted); font-size: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.submission-list button em { color: #666; font-style: normal; font-size: 8px; }
.submission-list button b { color: var(--orange); font-size: 12px; }
.reviewer-empty { color: var(--muted); text-align: center; padding: 30px 10px; font-size: 11px; }
.reviewer-empty.error { color: var(--red); }
.reviewer-detail { min-height: 620px; padding: 28px; }
.reviewer-placeholder { min-height: 560px; display: grid; place-content: center; text-align: center; color: var(--muted); }
.reviewer-placeholder strong { color: var(--white); }
.candidate-detail-head { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
.candidate-detail-head h2 { margin: 7px 0 4px; font: 800 31px/1.1 Manrope; }
.candidate-detail-head > div:first-child > p:last-child { color: var(--muted); font-size: 11px; }
.candidate-total { display: grid; text-align: right; }
.candidate-total strong { font: 800 38px/1 Manrope; color: var(--orange); }
.candidate-total span { color: var(--muted); font-size: 9px; }
.reviewer-rounds { padding: 17px 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.reviewer-rounds article { display: grid; grid-template-columns: 1fr auto; align-items: baseline; background: var(--surface); border: 1px solid var(--line); border-radius: 11px; padding: 15px; }
.reviewer-rounds span { color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-size: 9px; }
.reviewer-rounds strong { font: 800 20px/1 Manrope; }
.reviewer-rounds small { grid-column: 1/-1; color: var(--orange); margin-top: 5px; font-size: 9px; }
.reviewer-strengths > h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .09em; }
.reviewer-strengths > article { padding: 18px 0; border-top: 1px solid var(--line); }
.reviewer-strengths > article > div:first-child { display: flex; justify-content: space-between; font-size: 12px; }
.reviewer-strengths > article > div:first-child b { color: var(--orange); }
.reviewer-bar { height: 5px; background: var(--line); border-radius: 999px; overflow: hidden; margin: 9px 0 14px; }
.reviewer-bar span { display: block; height: 100%; background: var(--orange); }
.review-reasons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.review-reasons > div { background: #101010; border-radius: 9px; padding: 12px; }
.review-reasons span, .review-reasons summary { color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: .06em; }
.review-reasons ul { margin: 7px 0 0; padding-left: 16px; color: #c4bdb6; font-size: 10px; line-height: 1.55; }
.review-reasons details { grid-column: 1 / -1; padding: 9px 0; }
.reviewer-section { margin-top: 14px; border: 1px solid var(--line); border-radius: 11px; padding: 14px; }
.reviewer-section > summary { cursor: pointer; font-size: 11px; font-weight: 800; }
.reviewer-transcript { margin-top: 13px; display: grid; gap: 8px; }
.reviewer-transcript > div { max-width: 86%; }
.reviewer-transcript > div.user { justify-self: end; }
.reviewer-transcript span { color: var(--muted); font-size: 8px; }
.reviewer-transcript p { margin: 3px 0 0; background: #202020; padding: 10px; white-space: pre-wrap; border-radius: 9px; font-size: 10px; line-height: 1.55; }
.reviewer-transcript .user p { background: var(--orange-soft); border: 1px solid rgba(255,116,38,.25); }
.reviewer-answer { margin-top: 13px; }
.reviewer-answer strong { display: block; color: var(--orange); font-size: 9px; text-transform: uppercase; letter-spacing: .08em; margin-top: 12px; }
.reviewer-answer p, .reviewer-answer pre { white-space: pre-wrap; color: #c7c0b9; font: 10px/1.65 "DM Sans"; }

/* Dataset assessment v2 */
.assessment-timer { margin-left: auto; min-width: 132px; display: grid; justify-items: end; padding-left: 22px; border-left: 1px solid var(--line); }
.assessment-timer span { color: var(--muted); font-size: 8px; letter-spacing: .12em; }
.assessment-timer strong { font: 800 24px/1.2 Manrope; font-variant-numeric: tabular-nums; color: var(--white); }
.assessment-timer.urgent strong { color: #ff8270; animation: timerPulse 1.6s ease-in-out infinite; }
@keyframes timerPulse { 50% { opacity: .55; } }
.save-indicator { margin-left: auto; color: var(--muted); font-size: 9px; font-style: normal; }
.save-indicator.saved { color: #7ed6a2; }
.save-indicator.error { color: #ff8270; }
.dataset-assessment { width: min(1380px, calc(100% - 48px)); }
.dataset-card { margin: 30px 0 20px; border: 1px solid var(--line); background: #0d0d0d; border-radius: 16px; overflow: hidden; }
.dataset-head { padding: 22px 24px 18px; display: flex; justify-content: space-between; align-items: end; gap: 20px; border-bottom: 1px solid var(--line); }
.dataset-head h2 { margin: 5px 0 0; font: 750 23px/1.2 Manrope; }
.dataset-head > span { color: var(--muted); font-size: 9px; }
.dataset-scroll { overflow-x: auto; }
.dataset-card table { width: 100%; min-width: 960px; border-collapse: collapse; font-size: 11px; font-variant-numeric: tabular-nums; }
.dataset-card th, .dataset-card td { padding: 13px 15px; text-align: right; border-bottom: 1px solid rgba(255,255,255,.06); }
.dataset-card thead th { color: #928b84; background: #111; text-transform: uppercase; letter-spacing: .04em; font-size: 8px; white-space: nowrap; }
.dataset-card th:first-child, .dataset-card td:first-child { text-align: left; position: sticky; left: 0; background: #101010; z-index: 1; }
.dataset-card tbody th { color: var(--white); font-weight: 800; }
.dataset-card tbody tr:hover td, .dataset-card tbody tr:hover th { background: #17120f; }
.metric-notes { display: flex; flex-wrap: wrap; gap: 18px; padding: 13px 24px; color: var(--muted); font-size: 8px; }
.metric-notes b { color: #cfc8c1; }
.decision-case { grid-template-columns: .85fr 1.15fr; }
.decision-case ul { columns: 1; }
.decision-case li { margin-bottom: 8px; }
.analysis-field { display: block; margin: 20px 0; }
.analysis-field > span { display: grid; gap: 5px; margin-bottom: 10px; }
.analysis-field > span strong { font: 750 13px/1.3 Manrope; }
.analysis-field > span small { color: var(--muted); font-size: 10px; line-height: 1.5; }
.analysis-field textarea { width: 100%; resize: vertical; border: 1px solid var(--line); background: #0b0b0b; color: var(--white); border-radius: 11px; padding: 15px; line-height: 1.6; }
.analysis-field textarea:focus { border-color: rgba(255,116,38,.6); }
.analysis-field > em { display: block; margin-top: 6px; text-align: right; color: var(--muted); font-size: 8px; font-style: normal; }
.analysis-prompts { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0; }
.analysis-prompts > span { width: 100%; color: var(--muted); font-size: 9px; }
.analysis-prompts button { border: 1px solid rgba(255,116,38,.25); background: var(--orange-soft); color: #f6c6ad; border-radius: 999px; padding: 8px 12px; font-size: 9px; }
.analysis-prompts button:hover { border-color: var(--orange); }
.real-ai .chat-head > b { margin-left: auto; color: var(--muted); font-size: 8px; }
.chat-boundary { display: grid; gap: 3px; margin: 12px 14px 0; padding: 10px 11px; background: rgba(255,116,38,.07); border: 1px solid rgba(255,116,38,.2); border-radius: 8px; }
.chat-boundary strong { color: var(--orange); font-size: 9px; }
.chat-boundary span { color: var(--muted); font-size: 8px; line-height: 1.45; }
.chat-message p { white-space: pre-wrap; }
.chat-error { margin: 0 12px 8px; padding: 8px; color: #ff998b; background: rgba(255,80,60,.08); border-radius: 7px; font-size: 9px; }
.typing { animation: typingFade 1.2s ease-in-out infinite; }
@keyframes typingFade { 50% { opacity: .42; } }
.locked-chat { min-height: 330px; display: grid; place-content: center; justify-items: center; text-align: center; padding: 34px; }
.locked-chat h3 { margin: 16px 0 7px; font: 750 17px/1.3 Manrope; }
.locked-chat p { max-width: 280px; color: var(--muted); font-size: 10px; line-height: 1.6; }
.result-alert { margin: 18px 0; padding: 13px 16px; border: 1px solid rgba(255,116,38,.26); background: var(--orange-soft); color: #efc2aa; border-radius: 10px; font-size: 11px; }
.pending-grade { max-width: 420px; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: center; border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
.pending-grade .ai-avatar { grid-row: 1 / 3; }
.pending-grade strong { font: 750 15px/1.2 Manrope; }
.pending-grade p { margin: 0; color: var(--muted); font-size: 10px; line-height: 1.5; }
.score-logic { margin-top: 16px; border-top: 1px solid var(--line); padding-top: 12px; }
.score-logic summary { cursor: pointer; color: var(--orange); font-size: 10px; font-weight: 800; }
.score-logic > div { margin-top: 10px; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 10px; background: #101010; border-radius: 8px; }
.score-logic > div span, .score-logic > div strong { font-size: 9px; }
.score-logic > div strong { color: var(--orange); }
.score-logic > div p { grid-column: 1 / -1; margin: 0; color: var(--muted); font-size: 9px; line-height: 1.5; }
.round2-rubric { border-top-color: rgba(255,116,38,.22); }
.reviewer-actions { display: flex; gap: 9px; margin-top: 18px; }
.reviewer-actions .primary-button, .reviewer-actions .secondary-button { min-height: 40px; height: 40px; display: inline-flex; align-items: center; text-decoration: none; padding: 0 15px; font-size: 10px; }
.reviewer-rounds { grid-template-columns: repeat(3, 1fr); }
.reviewer-band-reason { margin: 4px 0 20px; padding: 18px; background: linear-gradient(135deg, rgba(255,116,38,.13), rgba(255,116,38,.035)); border: 1px solid rgba(255,116,38,.28); border-radius: 12px; }
.reviewer-band-reason h3 { margin: 6px 0 8px; font: 800 23px/1.2 Manrope; }
.reviewer-band-reason p { color: #d0c8c0; font-size: 11px; line-height: 1.65; }
.reviewer-band-reason > strong { font-size: 10px; line-height: 1.6; }
.reviewer-score-map { margin: 4px 0 16px; padding: 17px; border: 1px solid var(--line); border-radius: 12px; background: #0d0d0d; }
.reviewer-score-map h3 { margin: 6px 0 13px; font: 800 17px/1.2 Manrope; }
.reviewer-decision-summary { display: grid; grid-template-columns: 1fr 1fr 1.25fr; gap: 8px; margin-bottom: 20px; }
.reviewer-decision-summary article { padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: #101010; }
.reviewer-decision-summary article:first-child { border-color: rgba(89,212,147,.28); }
.reviewer-decision-summary article:nth-child(2) { border-color: rgba(255,123,104,.28); }
.reviewer-decision-summary article.interview-probe { border-color: rgba(255,116,38,.3); background: var(--orange-soft); }
.reviewer-decision-summary span { display: block; color: var(--muted); font-size: 8px; text-transform: uppercase; letter-spacing: .07em; }
.reviewer-decision-summary strong { display: block; margin-top: 7px; font-size: 10px; line-height: 1.4; }
.reviewer-decision-summary p { margin: 7px 0 0; color: var(--muted); font-size: 8px; line-height: 1.55; }
.reviewer-strengths > article > p { color: var(--muted); font-size: 10px; line-height: 1.55; }
.reviewer-score-breakdown { display: grid; gap: 7px; margin-top: 9px; }
.reviewer-score-breakdown > div { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; padding: 9px; background: #101010; border-radius: 7px; }
.reviewer-score-breakdown span, .reviewer-score-breakdown strong { font-size: 9px; }
.reviewer-score-breakdown strong { color: var(--orange); }
.reviewer-score-breakdown p { grid-column: 1 / -1; margin: 0; color: var(--muted); font-size: 9px; line-height: 1.5; }
.reviewer-work-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.reviewer-work-block { padding: 12px; background: #101010; border-radius: 9px; }
.reviewer-work-block strong { color: var(--orange); font-size: 9px; text-transform: uppercase; letter-spacing: .06em; }
.reviewer-work-block pre { margin: 8px 0 0; color: #c7c0b9; white-space: pre-wrap; font: 10px/1.6 "DM Sans"; }

/* Talemy 4D assessment v3 */
.flow-progress {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 0;
  padding: 14px 0 13px;
  border-bottom: 1px solid var(--line-soft);
}
.flow-progress > div {
  position: relative;
  display: flex;
  align-items: center;
  gap: 8px;
  color: #5f5a56;
  font-size: 9px;
  font-weight: 700;
}
.flow-progress > div:not(:last-child)::after {
  content: "";
  position: absolute;
  height: 1px;
  left: 33px;
  right: 10px;
  background: var(--line);
}
.flow-progress i {
  position: relative;
  z-index: 1;
  width: 24px;
  height: 24px;
  display: grid;
  place-items: center;
  border: 1px solid var(--line);
  border-radius: 50%;
  background: var(--black);
  font-style: normal;
}
.flow-progress .active { color: var(--white); }
.flow-progress .active i {
  color: #160900;
  border-color: var(--orange);
  background: var(--orange);
}
.flow-progress .active::after { background: var(--orange) !important; }

.reviewer-mode-toggle {
  width: 100%;
  margin-top: 11px;
  border: 0;
  background: transparent;
  color: var(--muted);
  font-size: 10px;
  text-decoration: underline;
}
.reviewer-mode-toggle:hover { color: var(--orange); }
.reviewer-skip-box {
  margin-top: 12px;
  padding: 14px;
  border: 1px solid rgba(255, 116, 38, .28);
  border-radius: 11px;
  background: rgba(255, 116, 38, .06);
}
.reviewer-skip-box label { margin: 0 0 9px; }
.reviewer-skip-box .secondary-button { width: 100%; min-height: 42px; }
.reviewer-skip-box small {
  display: block;
  margin-top: 8px;
  color: var(--muted);
  font-size: 9px;
  line-height: 1.45;
}
.public-rubric { max-width: 920px; margin: 22px auto 0; }
.simple-instructions ul {
  margin: 10px 0 0;
  padding-left: 18px;
  color: var(--muted);
  font-size: 12px;
  line-height: 1.75;
}

.phase-timer-row {
  min-height: 78px;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 18px;
  border-bottom: 1px solid var(--line-soft);
}
.phase-timer-row .assessment-timer { margin-left: 0; }
.delegation-intro-strip {
  margin: 28px 0 18px;
  padding: 18px 20px;
  display: grid;
  gap: 5px;
  border: 1px solid rgba(255, 116, 38, .3);
  border-radius: 13px;
  background: linear-gradient(120deg, rgba(255,116,38,.12), rgba(255,116,38,.02));
}
.delegation-intro-strip strong { font: 750 16px/1.3 Manrope; }
.delegation-intro-strip span { color: var(--muted); font-size: 11px; line-height: 1.55; }
.question-navigator {
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 7px;
  margin-bottom: 18px;
}
.question-navigator button {
  height: 38px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: #101010;
  color: var(--muted);
  font-size: 10px;
  font-weight: 800;
}
.question-navigator button.answered {
  color: var(--white);
  border-color: #57514c;
}
.question-navigator button.current {
  color: #160900;
  border-color: var(--orange);
  background: var(--orange);
}
.delegation-question-card {
  min-height: 430px;
  padding: clamp(26px, 5vw, 58px);
  display: grid;
  align-content: center;
  border: 1px solid var(--line);
  border-radius: 19px;
  background:
    radial-gradient(600px 280px at 100% 0, rgba(255,116,38,.08), transparent 60%),
    var(--black-2);
}
.question-meta {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  color: var(--orange);
  font-size: 10px;
  font-weight: 800;
  letter-spacing: .09em;
}
.question-meta em {
  color: var(--muted);
  font-style: normal;
  font-weight: 500;
  letter-spacing: 0;
}
.delegation-question-card h1 {
  max-width: 960px;
  margin: 30px 0 16px;
  font: 760 clamp(25px, 3.8vw, 42px)/1.25 Manrope;
  letter-spacing: -.035em;
}
.delegation-question-card > p {
  color: var(--muted);
  font-size: 13px;
}
.boolean-choice {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  width: min(100%, 430px);
  margin-top: 24px;
}
.boolean-choice button {
  height: 58px;
  border: 1px solid var(--line);
  border-radius: 11px;
  background: #111;
  color: var(--white);
  font-weight: 800;
}
.boolean-choice button.selected {
  color: #160900;
  border-color: var(--orange);
  background: var(--orange);
}
.boolean-choice button:disabled { opacity: .45; cursor: not-allowed; }
.consult-counter {
  min-width: 155px;
  display: grid;
  justify-items: end;
}
.consult-counter span { color: var(--muted); font-size: 8px; letter-spacing: .11em; }
.consult-counter strong { color: var(--orange); font: 800 24px/1.2 Manrope; }
.consult-box {
  max-width: 680px;
  margin-top: 22px;
  padding: 17px;
  border: 1px dashed #47413c;
  border-radius: 12px;
  background: #0d0d0d;
}
.consult-box p { margin: 0 0 12px; color: var(--muted); font-size: 11px; line-height: 1.55; }
.ai-consult-button {
  min-height: 44px;
  padding: 0 16px;
  border: 1px solid rgba(255,116,38,.4);
  border-radius: 9px;
  background: var(--orange-soft);
  color: #ffc9ab;
  font-size: 11px;
  font-weight: 800;
}
.ai-consult-button:disabled { opacity: .4; cursor: not-allowed; }
.ai-hint {
  max-width: 900px;
  margin-top: 23px;
  padding: 19px;
  border: 1px solid rgba(255,116,38,.34);
  border-radius: 13px;
  background: linear-gradient(130deg, rgba(255,116,38,.11), #101010);
}
.ai-hint > div { display: flex; align-items: center; gap: 10px; }
.ai-hint p { color: #ddd5ce; font-size: 12px; line-height: 1.7; white-space: pre-wrap; }
.ai-hint small { color: var(--muted); font-size: 9px; }
.delegation-transition { padding-bottom: 90px; }
.transition-card {
  width: min(760px, 100%);
  margin: 70px auto 0;
  padding: clamp(28px, 6vw, 60px);
  text-align: center;
  border: 1px solid rgba(255,116,38,.33);
  border-radius: 22px;
  background: radial-gradient(circle at 50% 0, rgba(255,116,38,.14), transparent 48%), var(--surface);
}
.human-score {
  display: block;
  margin: 24px 0;
  color: var(--orange);
  font: 800 76px/1 Manrope;
}
.transition-card h1 { margin: 0 auto 13px; font: 800 34px/1.15 Manrope; }
.transition-card > p:not(.eyebrow) { color: var(--muted); line-height: 1.65; }
.transition-card ul {
  margin: 25px auto;
  max-width: 570px;
  text-align: left;
  color: #d3ccc5;
  font-size: 12px;
  line-height: 1.8;
}
.metric-card-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin: 42px 0 18px;
}
.metric-card-grid article {
  min-height: 150px;
  padding: 23px;
  display: grid;
  align-content: space-between;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: var(--surface);
}
.metric-card-grid article.accent {
  border-color: rgba(255,116,38,.45);
  background: linear-gradient(135deg, rgba(255,116,38,.16), var(--surface));
}
.metric-card-grid span { color: var(--muted); font-size: 9px; letter-spacing: .1em; }
.metric-card-grid strong { font: 800 38px/1 Manrope; }
.delegation-interpretation {
  display: flex;
  align-items: center;
  gap: 24px;
  padding: 28px;
  border: 1px solid var(--line);
  border-radius: 17px;
  background: #0d0d0d;
}
.delegation-interpretation h1 { margin: 6px 0; font: 800 28px/1.2 Manrope; }
.delegation-interpretation p { color: #d2cbc4; font-size: 12px; line-height: 1.65; }
.delegation-interpretation small { color: var(--muted); font-size: 9px; }
.delegation-breakdown {
  margin-top: 18px;
  padding: 20px;
  border: 1px solid var(--line);
  border-radius: 15px;
  background: var(--black-2);
}
.delegation-breakdown summary { cursor: pointer; color: var(--orange); font-weight: 800; }
.delegation-breakdown > div { display: grid; gap: 8px; margin-top: 16px; }
.delegation-breakdown article {
  display: grid;
  grid-template-columns: 34px 1fr;
  gap: 12px;
  padding: 14px;
  border-left: 3px solid var(--line);
  border-radius: 8px;
  background: #111;
}
.delegation-breakdown article.good { border-color: var(--green); }
.delegation-breakdown article.warning { border-color: #e2b35f; }
.delegation-breakdown article.bad { border-color: var(--red); }
.delegation-breakdown article > b {
  width: 28px;
  height: 28px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: #242424;
  color: var(--orange);
  font-size: 10px;
}
.delegation-breakdown article strong { display: block; font-size: 11px; line-height: 1.5; }
.delegation-breakdown article span { display: block; margin-top: 5px; color: var(--muted); font-size: 9px; }
.delegation-breakdown article p { margin: 6px 0 0; font-size: 10px; }

.description-task-tabs {
  min-height: 72px;
  display: flex;
  align-items: center;
  gap: 8px;
  border-bottom: 1px solid var(--line-soft);
}
.description-task-tabs button {
  min-height: 40px;
  padding: 0 16px;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: #111;
  color: var(--muted);
  font-size: 10px;
  font-weight: 800;
}
.description-task-tabs button.active {
  color: #160900;
  border-color: var(--orange);
  background: var(--orange);
}
.description-task-tabs button:disabled { opacity: .35; cursor: not-allowed; }
.description-brief {
  margin: 28px 0 18px;
  padding: 28px;
  border: 1px solid rgba(255,116,38,.3);
  border-radius: 17px;
  background: linear-gradient(130deg, rgba(255,116,38,.12), #0e0e0e);
}
.description-brief h1 { margin: 8px 0 10px; font: 800 34px/1.15 Manrope; letter-spacing: -.035em; }
.description-brief > p:not(.eyebrow) { max-width: 890px; color: #d2cbc4; line-height: 1.65; }
.description-brief ul {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px 28px;
  padding-left: 18px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.5;
}
.description-layout {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 420px;
  gap: 20px;
  align-items: start;
}
.description-work {
  padding: 25px;
  border: 1px solid var(--line);
  border-radius: 17px;
  background: var(--black-2);
}
.starter-prompts { display: flex; flex-wrap: wrap; gap: 8px; }
.starter-prompts > span { width: 100%; color: var(--muted); font-size: 9px; }
.starter-prompts button {
  padding: 8px 11px;
  border: 1px solid rgba(255,116,38,.25);
  border-radius: 999px;
  background: var(--orange-soft);
  color: #f5c2a6;
  font-size: 9px;
}

.discernment-instructions { padding: 50px 0 22px; max-width: 980px; }
.discernment-instructions h1 { margin: 10px 0 13px; font: 800 clamp(34px, 5vw, 52px)/1.08 Manrope; letter-spacing: -.045em; }
.discernment-instructions > p:not(.eyebrow) { color: var(--muted); font-size: 15px; line-height: 1.7; }
.discernment-instructions > div {
  margin-top: 21px;
  padding: 17px;
  display: grid;
  gap: 5px;
  border-left: 3px solid var(--orange);
  background: var(--orange-soft);
}
.discernment-instructions > div span { color: #d6c8be; font-size: 11px; }
.case-requirements {
  padding: 22px 25px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: var(--surface);
}
.case-requirements h2 { margin: 0 0 10px; font: 750 18px/1.3 Manrope; }
.case-requirements ul {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px 25px;
  margin: 0;
  padding-left: 18px;
  color: var(--muted);
  font-size: 11px;
}
.ai-output-review {
  margin: 18px 0;
  padding: 27px;
  border: 1px solid rgba(226,179,95,.33);
  border-radius: 16px;
  background: rgba(226,179,95,.07);
}
.ai-output-head { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
.ai-output-head > div { display: grid; gap: 3px; }
.ai-output-head small { color: var(--muted); }
.ai-output-review > p { color: #ded8d1; font-size: 12px; line-height: 1.75; }
.finding-list { padding: 26px; border: 1px solid var(--line); border-radius: 17px; background: var(--black-2); }
.finding-list-head { display: flex; justify-content: space-between; align-items: end; gap: 20px; }
.finding-list-head h2 { margin: 5px 0 0; font: 800 25px/1.2 Manrope; }
.finding-card {
  position: relative;
  margin-top: 15px;
  padding: 22px 22px 18px 58px;
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
  border: 1px solid var(--line);
  border-radius: 13px;
  background: #101010;
}
.finding-card label { margin: 0; }
.finding-card label span { color: #d5cec7; font-size: 10px; }
.finding-card textarea { min-height: 110px; font-size: 11px; }
.finding-number {
  position: absolute;
  left: 17px;
  top: 20px;
  width: 27px;
  height: 27px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--orange);
  color: #160900;
  font-size: 10px;
  font-weight: 800;
}
.remove-finding {
  grid-column: 1 / -1;
  justify-self: end;
  border: 0;
  background: transparent;
  color: var(--red);
  font-size: 9px;
}

.score-ring {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
.score-ring > strong, .score-ring > span { position: relative; z-index: 1; }
.score-ring > span { margin-top: 3px; }
.round-summary-grid { grid-template-columns: repeat(3, 1fr); }
.overall-summary-card { border-color: rgba(89,212,147,.32) !important; }
.mini-strength-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.mini-strength-list span {
  padding: 5px 7px;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--muted);
  font-size: 8px;
}
.four-strengths { grid-template-columns: repeat(2, 1fr); }
.na-score {
  width: 68px;
  height: 68px;
  display: grid;
  place-items: center;
  border: 1px dashed var(--line);
  border-radius: 50%;
  color: var(--muted);
  font-weight: 800;
}
.score-logic > div em {
  grid-column: 1 / -1;
  color: #d3a98f;
  font-size: 8px;
  font-style: normal;
}
.grader-note strong { display: block; margin-top: 8px; color: #f4d0ba; font-size: 10px; }

.danger-button {
  min-height: 40px;
  padding: 0 14px;
  border: 1px solid rgba(255,123,104,.38);
  border-radius: 9px;
  background: rgba(255,123,104,.08);
  color: #ff9d90;
  font-size: 10px;
  font-weight: 800;
}
.danger-button:disabled { opacity: .35; cursor: not-allowed; }
.reviewer-rounds.four { grid-template-columns: repeat(4, 1fr); }
.reviewer-band-reason ul {
  margin: 12px 0 0;
  padding-left: 18px;
  color: var(--muted);
  font-size: 10px;
  line-height: 1.65;
}
.reviewer-score-breakdown em {
  grid-column: 1 / -1;
  color: #d4aa91;
  font-size: 8px;
  font-style: normal;
}
.reviewer-pending {
  margin: 6px 0 18px;
  padding: 18px;
  border: 1px dashed var(--line);
  border-radius: 11px;
  color: var(--muted);
}
.reviewer-pending strong { color: var(--white); }
.reviewer-pending p { margin-bottom: 0; font-size: 10px; }
.reviewer-metric-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 8px;
  margin-top: 14px;
}
.reviewer-metric-grid span {
  padding: 12px;
  display: grid;
  gap: 4px;
  border: 1px solid var(--line);
  border-radius: 9px;
  color: var(--muted);
  font-size: 9px;
}
.reviewer-metric-grid b { color: var(--orange); font-size: 17px; }
.reviewer-delegation-rows { display: grid; gap: 6px; margin-top: 12px; }
.reviewer-delegation-rows > div {
  display: grid;
  grid-template-columns: 38px 1fr auto;
  gap: 8px;
  align-items: center;
  padding: 10px;
  border-left: 3px solid var(--line);
  border-radius: 7px;
  background: #101010;
  font-size: 9px;
}
.reviewer-delegation-rows > div.good { border-color: var(--green); }
.reviewer-delegation-rows > div.warning { border-color: #e2b35f; }
.reviewer-delegation-rows > div.bad { border-color: var(--red); }
.reviewer-delegation-rows span { color: #d1cac3; }
.reviewer-delegation-rows small { color: var(--muted); }
.reviewer-task-block { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--line); }
.reviewer-task-block h4 { margin: 0; color: var(--orange); }
.reviewer-findings { display: grid; gap: 8px; margin-top: 13px; }
.reviewer-findings article {
  display: grid;
  grid-template-columns: 28px 1fr;
  gap: 10px;
  padding: 12px;
  border-radius: 8px;
  background: #101010;
}
.reviewer-findings article > b {
  width: 26px;
  height: 26px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--orange);
  color: #160900;
  font-size: 9px;
}
.reviewer-findings article strong { font-size: 10px; }
.reviewer-findings article p { margin: 5px 0; color: var(--muted); font-size: 9px; line-height: 1.5; }
.reviewer-findings article small { color: #d9a98f; font-size: 8px; }
.reviewer-ground-truth { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
.reviewer-ground-truth > div {
  padding: 12px;
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 4px 8px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #0d0d0d;
}
.reviewer-ground-truth > div.detected { border-color: rgba(89,212,147,.35); }
.reviewer-ground-truth > div.missed { border-color: rgba(255,123,104,.3); }
.reviewer-ground-truth strong { font-size: 9px; }
.reviewer-ground-truth span { color: var(--orange); font-size: 9px; }
.reviewer-ground-truth p, .reviewer-ground-truth small {
  grid-column: 1 / -1;
  margin: 0;
  color: var(--muted);
  font-size: 8px;
  line-height: 1.5;
}
.ground-truth-key { margin-top: 12px; padding: 12px; border: 1px dashed rgba(255,116,38,.3); border-radius: 8px; }
.ground-truth-key > summary { cursor: pointer; color: var(--orange); font-size: 9px; font-weight: 800; }
.ground-truth-key > div { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin-top: 10px; }
.ground-truth-key article { padding: 10px; border-radius: 7px; background: #101010; }
.ground-truth-key strong { color: #f0c4aa; font-size: 8px; }
.ground-truth-key p { margin: 5px 0 0; color: var(--muted); font-size: 8px; line-height: 1.5; }
.reviewer-json {
  max-height: 520px;
  overflow: auto;
  margin: 13px 0 0;
  padding: 12px;
  border-radius: 8px;
  background: #080808;
  color: #bdb6af;
  white-space: pre-wrap;
  font: 9px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
}

@media print {
  body { background: #fff; color: #111; }
  .assessment-header, .result-footer button { display: none; }
  .results-page { width: 100%; }
  .strength-results > article, .round-summary-grid article { break-inside: avoid; background: #fff; color: #111; }
  .score-ring::after, .score-ring.small::after { background: #fff; }
}

@media (max-width: 980px) {
  .landing-hero { grid-template-columns: 1fr; gap: 45px; padding-top: 60px; }
  .candidate-card { max-width: 650px; }
  .round2-layout { grid-template-columns: 1fr; }
  .ai-chat { position: static; }
  .chat-messages { height: 330px; }
  .strength-results { grid-template-columns: 1fr; }
  .rubric-grid { grid-template-columns: 1fr; }
  .rubric-grid article { min-height: 0; }
  .rubric-grid h2 { margin-top: 24px; }
  .reviewer-layout { grid-template-columns: 1fr; }
  .submission-list { position: static; }
  .submission-list > div { max-height: 330px; }
  .dataset-assessment { width: min(100% - 28px, 1180px); }
  .description-layout { grid-template-columns: 1fr; }
  .description-layout .ai-chat { position: static; }
  .finding-card { grid-template-columns: 1fr; }
  .metric-card-grid { grid-template-columns: 1fr 1fr; }
  .four-strengths { grid-template-columns: 1fr; }
}

@media (max-width: 720px) {
  .site-shell, .assessment-shell { width: min(100% - 22px, 1180px); }
  .main-header { height: 78px; }
  .main-header nav a:first-child { display: none; }
  .logo-lockup img { width: 125px; }
  .logo-lockup span { display: none; }
  .hero-copy h1 { font-size: 45px; }
  .hero-facts { gap: 24px; flex-wrap: wrap; }
  .candidate-card { padding: 22px; }
  .two-inputs { grid-template-columns: 1fr; gap: 0; }
  .journey { grid-template-columns: 1fr; gap: 12px; }
  .journey-arrow { transform: rotate(90deg); height: 34px; }
  .unlock-card { grid-template-columns: auto 1fr; }
  .unlock-card .primary-button, .unlock-card .secondary-button { grid-column: 1 / -1; }
  .rubric-hero { display: block; padding-top: 55px; }
  .rubric-note { margin-top: 25px; }
  .case-preview { grid-template-columns: 1fr; gap: 20px; }
  .task-column { padding: 24px 18px; }
  .delegation-list article { grid-template-columns: 1fr; }
  .choice-segment { display: grid; grid-template-columns: repeat(3, 1fr); }
  .choice-segment button { white-space: normal; padding: 9px 5px; }
  .source-card dl { grid-template-columns: 1fr; }
  .source-card dl div:nth-child(odd) { border-right: 0; }
  .task-actions { gap: 8px; }
  .task-actions button { flex: 1; padding: 0 10px; }
  .result-hero { display: block; }
  .overall-score { margin-top: 35px; }
  .round-summary-grid { grid-template-columns: 1fr; }
  .result-section-head { display: block; }
  .score-architecture-head { display: block; }
  .score-architecture-head > p { margin-top: 12px; }
  .band-scale { grid-template-columns: 1fr 1fr; }
  .executive-insights { grid-template-columns: 1fr; }
  .result-footer { align-items: stretch; flex-direction: column; }
  .result-footer > div:last-child { display: grid; grid-template-columns: 1fr 1fr; }
  .reviewer-page { width: min(100% - 20px, 1380px); }
  .reviewer-login-page { width: min(100% - 20px, 1080px); }
  .reviewer-login-card { margin-top: 42px; padding: 24px; }
  .reviewer-header > div:last-child > span, .reviewer-header > div:last-child > strong { display: none; }
  .reviewer-brand > span { display: none; }
  .reviewer-title { display: block; }
  .reviewer-count { text-align: left; margin-top: 18px; }
  .reviewer-detail { padding: 18px; }
  .review-reasons { grid-template-columns: 1fr; }
  .review-reasons details { grid-column: auto; }
  .candidate-detail-head { align-items: flex-start; }
  .assessment-header { flex-wrap: wrap; height: auto; min-height: 76px; padding: 12px 0; }
  .assessment-timer { min-width: 108px; padding-left: 12px; }
  .assessment-timer span { font-size: 7px; }
  .assessment-timer strong { font-size: 19px; }
  .dataset-assessment { width: min(100% - 16px, 1180px); }
  .dataset-head { align-items: start; flex-direction: column; }
  .metric-notes { display: grid; gap: 6px; }
  .reviewer-rounds, .reviewer-work-grid { grid-template-columns: 1fr; }
  .reviewer-actions { flex-wrap: wrap; }
  .flow-progress span { display: none; }
  .flow-progress > div:not(:last-child)::after { left: 28px; right: 5px; }
  .question-navigator { grid-template-columns: repeat(6, 1fr); }
  .delegation-question-card { min-height: 360px; padding: 25px 20px; }
  .question-meta { align-items: flex-start; flex-direction: column; gap: 5px; }
  .boolean-choice { width: 100%; }
  .metric-card-grid { grid-template-columns: 1fr 1fr; }
  .delegation-interpretation { align-items: flex-start; flex-direction: column; }
  .description-brief ul, .case-requirements ul { grid-template-columns: 1fr; }
  .description-task-tabs { flex-wrap: wrap; padding: 12px 0; }
  .description-task-tabs .save-indicator { width: 100%; margin-left: 0; }
  .finding-list { padding: 18px; }
  .finding-list-head { align-items: stretch; flex-direction: column; }
  .finding-card { padding: 54px 14px 15px; }
  .finding-number { top: 14px; left: 14px; }
  .round-summary-grid { grid-template-columns: 1fr; }
  .reviewer-rounds.four, .reviewer-metric-grid, .reviewer-ground-truth {
    grid-template-columns: 1fr 1fr;
  }
  .reviewer-methodology-grid, .reviewer-criteria-grid,
  .reviewer-decision-summary { grid-template-columns: 1fr; }
  .reviewer-band-grid { grid-template-columns: 1fr 1fr; }
  .ground-truth-key > div { grid-template-columns: 1fr; }
  .reviewer-delegation-rows > div {
    grid-template-columns: 34px 1fr;
  }
  .reviewer-delegation-rows small { grid-column: 2; }
}
</style>
