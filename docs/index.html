<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Bài đánh giá thực hành năng lực ứng dụng AI trong công việc theo khung 4D.">
  <meta name="theme-color" content="#0B0F19">
  <title>Talemy · AI Skill Test Round 2</title>
  <style>

:root {
  --ink: #0b0f19;
  --panel: #131a2a;
  --panel-2: #192235;
  --paper: #f4f0e8;
  --paper-2: #e9e3d8;
  --amber: #e0a94c;
  --amber-soft: #f1cc82;
  --mint: #4fcb8e;
  --coral: #f2784b;
  --text: #f6f2ea;
  --muted: #aeb6c7;
  --line: rgba(255,255,255,.12);
}

* { box-sizing: border-box; }
html { background: var(--ink); scroll-behavior: smooth; }
body { margin: 0; background: var(--ink); color: var(--text); font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
button, input, select, textarea { font: inherit; }
button { cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid rgba(224,169,76,.45); outline-offset: 2px; }
h1, h2, h3, p { margin-top: 0; }
h1, h2, h3 { font-family: Georgia, "Times New Roman", serif; font-weight: 500; }

.brandbar, .test-header { min-height: 78px; display: flex; align-items: center; justify-content: space-between; padding: 0 clamp(22px, 5vw, 76px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: baseline; gap: 12px; }
.brand span { color: var(--amber); font-size: 28px; font-weight: 800; letter-spacing: -1.4px; }
.brand em { color: var(--muted); font-style: normal; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; }
.round-label, .eyebrow, .test-meta, .score-overview em { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .13em; text-transform: uppercase; font-size: 11px; }
.round-label { color: var(--muted); border: 1px solid var(--line); padding: 8px 12px; border-radius: 999px; }
.eyebrow { color: var(--muted); margin-bottom: 12px; }
.eyebrow.accent { color: var(--amber); }

.landing-shell { min-height: 100vh; background: radial-gradient(circle at 75% 18%, rgba(224,169,76,.08), transparent 28%), var(--ink); }
.hero { width: min(1240px, calc(100% - 44px)); margin: 0 auto; padding: clamp(62px, 9vw, 124px) 0 72px; display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(360px, .68fr); gap: clamp(48px, 8vw, 100px); align-items: center; }
.hero-copy h1 { font-size: clamp(47px, 6vw, 82px); line-height: .98; letter-spacing: -.04em; max-width: 850px; margin-bottom: 30px; }
.hero-copy h1 span { color: var(--amber-soft); }
.lead { color: #c5cad4; font-size: 18px; line-height: 1.7; max-width: 680px; }
.hero-stats { display: flex; gap: 44px; margin-top: 48px; padding-top: 28px; border-top: 1px solid var(--line); max-width: 680px; }
.hero-stats div { display: flex; flex-direction: column; }
.hero-stats strong { color: var(--amber); font: 500 34px/1 Georgia, serif; }
.hero-stats span { color: var(--muted); font-size: 12px; margin-top: 7px; text-transform: uppercase; letter-spacing: .1em; }

.start-card { background: linear-gradient(145deg, rgba(25,34,53,.98), rgba(18,25,41,.98)); border: 1px solid rgba(224,169,76,.26); border-radius: 4px; padding: clamp(26px, 4vw, 42px); box-shadow: 0 32px 90px rgba(0,0,0,.26); position: relative; }
.start-card:before { content: ""; position: absolute; height: 3px; inset: 0 0 auto; background: var(--amber); }
.card-kicker { color: var(--amber-soft); font-size: 10px; letter-spacing: .14em; margin-bottom: 24px; }
.live-dot { width: 7px; height: 7px; background: var(--mint); border-radius: 50%; display: inline-block; margin-right: 8px; box-shadow: 0 0 0 5px rgba(79,203,142,.1); }
.start-card h2 { font-size: 34px; margin-bottom: 12px; }
.start-card > p { color: var(--muted); line-height: 1.65; font-size: 14px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 28px 0 18px; }
.form-grid label, .textarea-label { color: #d9dce4; font-size: 12px; display: flex; flex-direction: column; gap: 8px; font-weight: 700; }
.form-grid label span { color: var(--muted); font-weight: 400; }
.form-grid .full { grid-column: 1 / -1; }
input, select, textarea { width: 100%; background: rgba(7,11,19,.62); color: var(--text); border: 1px solid var(--line); border-radius: 3px; padding: 13px 14px; transition: border-color .2s, background .2s; }
input:hover, select:hover, textarea:hover { border-color: rgba(224,169,76,.45); }
textarea { resize: vertical; min-height: 120px; line-height: 1.6; }
.primary-btn, .secondary-btn { border: 0; border-radius: 2px; min-height: 50px; padding: 0 20px; font-weight: 800; display: inline-flex; align-items: center; justify-content: center; gap: 18px; transition: transform .18s, background .18s; }
.primary-btn { width: 100%; color: #17130c; background: var(--amber); }
.primary-btn:hover { background: #ebbc6c; transform: translateY(-1px); }
.primary-btn.compact { width: auto; }
.secondary-btn { color: var(--text); background: transparent; border: 1px solid var(--line); }
.secondary-btn:hover { border-color: var(--amber); }
.demo-link { width: 100%; border: 0; background: none; color: var(--amber-soft); margin-top: 15px; font-size: 12px; text-decoration: underline; text-underline-offset: 4px; }
.privacy-note { text-align: center; font-size: 11px !important; margin: 15px 0 0; }
.error { color: #ffd1c2; background: rgba(242,120,75,.12); border-left: 3px solid var(--coral); padding: 12px 14px; margin: 14px 0; font-size: 13px; }
.four-d-strip { border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4, 1fr); padding: 0 clamp(22px, 5vw, 76px); }
.four-d-strip div { padding: 28px 22px; border-right: 1px solid var(--line); display: grid; grid-template-columns: auto 1fr; column-gap: 12px; }
.four-d-strip div:first-child { border-left: 1px solid var(--line); }
.four-d-strip span { color: var(--amber); font: 11px ui-monospace, monospace; grid-row: 1 / 3; }
.four-d-strip strong { font: 500 18px Georgia, serif; }
.four-d-strip p { margin: 4px 0 0; color: var(--muted); font-size: 12px; }

.test-shell { min-height: 100vh; }
.test-header { position: sticky; z-index: 20; top: 0; background: rgba(11,15,25,.94); backdrop-filter: blur(14px); }
.test-meta { display: flex; gap: 24px; color: var(--muted); }
.test-meta time { color: var(--amber); }
.progress-track { height: 3px; background: #252d3a; position: sticky; top: 78px; z-index: 21; }
.progress-track span { display: block; height: 100%; background: var(--amber); transition: width .4s ease; }
.stage-nav { max-width: 1450px; margin: 0 auto; padding: 26px 30px 8px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.stage-nav div { display: flex; align-items: center; gap: 8px; color: #697387; font-size: 11px; }
.stage-nav span { width: 24px; height: 24px; display: grid; place-items: center; border: 1px solid #3b4557; border-radius: 50%; font: 10px ui-monospace, monospace; }
.stage-nav em { font-style: normal; white-space: nowrap; }
.stage-nav .active { color: var(--amber-soft); }
.stage-nav .active span { background: var(--amber); color: var(--ink); border-color: var(--amber); }
.stage-nav .done { color: var(--mint); }
.stage-nav .done span { border-color: var(--mint); }
.workbench { max-width: 1450px; margin: 0 auto; padding: 22px 30px 70px; display: grid; grid-template-columns: minmax(330px, .72fr) minmax(0, 1.28fr); gap: 24px; align-items: start; }
.source-pack, .task-panel { border: 1px solid var(--line); background: var(--panel); }
.source-pack { position: sticky; top: 126px; }
.source-head { min-height: 88px; padding: 20px 22px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); }
.source-head .eyebrow { margin-bottom: 4px; }
.source-head h2 { margin: 0; font-size: 24px; }
.status-pill { border: 1px solid rgba(224,169,76,.35); color: var(--amber); padding: 6px 8px; font: 10px ui-monospace, monospace; }
.source-tabs { display: grid; grid-template-columns: repeat(3, 1fr); border-bottom: 1px solid var(--line); }
.source-tabs button { background: transparent; color: var(--muted); border: 0; border-right: 1px solid var(--line); padding: 13px 6px; font-size: 11px; }
.source-tabs button:last-child { border-right: 0; }
.source-tabs button.active { color: var(--amber); box-shadow: inset 0 -2px var(--amber); }
.source-body { padding: 20px 22px 24px; min-height: 410px; }
.metric-grid { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); }
.metric-grid div { padding: 15px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); display: flex; flex-direction: column; }
.metric-grid div:nth-child(2n) { border-right: 0; }
.metric-grid div:nth-child(n+3) { border-bottom: 0; }
.metric-grid strong { font: 500 27px Georgia, serif; color: var(--amber-soft); }
.metric-grid span { font-size: 10px; color: var(--muted); margin-top: 4px; }
.source-note { font-size: 11px; color: var(--muted); line-height: 1.5; padding: 12px 0; margin: 0; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 11px; }
th, td { text-align: right; border-bottom: 1px solid var(--line); padding: 9px 6px; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--muted); font-weight: 500; }
.microcopy { font-size: 10px; color: #7f899d; margin: 12px 0 0; }
.prose-small { color: #cad0dc; font-size: 13px; line-height: 1.7; }
.untrusted { display: flex; gap: 10px; border: 1px solid rgba(242,120,75,.4); background: rgba(242,120,75,.08); padding: 13px; margin-top: 20px; }
.untrusted p { margin: 0; }
.policy-list { padding-left: 18px; margin: 0; }
.policy-list li { padding-left: 5px; margin-bottom: 15px; }

.task-panel { padding: clamp(26px, 4vw, 52px); min-height: 680px; }
.task-panel > h1 { font-size: clamp(36px, 4vw, 54px); line-height: 1.04; letter-spacing: -.025em; margin-bottom: 18px; }
.task-intro { max-width: 760px; color: var(--muted); line-height: 1.7; margin-bottom: 30px; }
.allocation-list { border-top: 1px solid var(--line); }
.allocation-item { padding: 19px 0; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center; }
.allocation-item > div:first-child { display: grid; grid-template-columns: 34px 1fr; }
.allocation-item > div:first-child > span { grid-row: 1 / 3; color: var(--amber); font: 10px ui-monospace, monospace; padding-top: 3px; }
.allocation-item strong { font-size: 14px; }
.allocation-item p { grid-column: 2; color: var(--muted); font-size: 11px; margin: 5px 0 0; }
.segmented { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); min-width: 250px; }
.segmented button { background: transparent; color: var(--muted); border: 0; border-right: 1px solid var(--line); padding: 10px 12px; font-size: 11px; }
.segmented button:last-child { border-right: 0; }
.segmented button.active { color: var(--ink); background: var(--amber); }
.prompt-hints { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 20px; }
.prompt-hints span { color: var(--muted); border: 1px solid var(--line); padding: 7px 10px; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; }
.textarea-label { margin-top: 18px; }
.textarea-label > span { color: var(--muted); font-weight: 400; text-align: right; }
.ai-output { margin: 0 0 28px; padding: 26px; background: #0d1320; border: 1px solid rgba(224,169,76,.3); border-left: 3px solid var(--amber); color: #d8dce5; }
.ai-output > span { color: var(--amber); font: 10px ui-monospace, monospace; letter-spacing: .1em; }
.ai-output p { margin: 14px 0 0; line-height: 1.7; }
.choice-list { display: grid; gap: 9px; }
.choice-row { width: 100%; background: transparent; color: #d9dde6; border: 1px solid var(--line); text-align: left; padding: 14px; display: flex; gap: 12px; align-items: flex-start; line-height: 1.5; }
.choice-row:hover { border-color: rgba(224,169,76,.5); }
.choice-row.selected { background: rgba(224,169,76,.08); border-color: var(--amber); }
.check-box { flex: 0 0 20px; width: 20px; height: 20px; border: 1px solid #5c6679; display: grid; place-items: center; color: var(--ink); }
.selected .check-box { background: var(--amber); border-color: var(--amber); }
.risk-list { display: grid; gap: 16px; }
.risk-card { border: 1px solid var(--line); padding: 20px; margin: 0; }
.risk-card legend { color: #ece8df; padding: 0 8px; font-weight: 700; line-height: 1.45; }
.risk-card legend span { color: var(--amber); font: 10px ui-monospace, monospace; margin-right: 10px; }
.risk-card label { display: flex; gap: 10px; padding: 10px 11px; color: var(--muted); font-size: 13px; border: 1px solid transparent; }
.risk-card label.selected { color: var(--text); background: rgba(224,169,76,.08); border-color: rgba(224,169,76,.36); }
.risk-card input { width: auto; accent-color: var(--amber); }
.change-alert { border: 1px solid rgba(224,169,76,.4); background: rgba(224,169,76,.08); padding: 18px; display: flex; gap: 14px; margin-bottom: 28px; }
.change-alert span { align-self: flex-start; color: var(--ink); background: var(--amber); font: 10px ui-monospace, monospace; padding: 5px 7px; }
.change-alert p { margin: 0; line-height: 1.6; }
.radio-cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 24px; }
.radio-cards button { min-height: 126px; background: transparent; color: var(--text); border: 1px solid var(--line); text-align: left; padding: 18px; display: flex; flex-direction: column; gap: 8px; }
.radio-cards button:hover, .radio-cards button.selected { border-color: var(--amber); }
.radio-cards button.selected { background: rgba(224,169,76,.09); box-shadow: inset 0 3px var(--amber); }
.radio-cards strong { font-size: 14px; }
.radio-cards span { color: var(--muted); line-height: 1.5; font-size: 12px; }
.subhead { margin: 30px 0 14px; font-family: Inter, sans-serif; font-size: 14px; }
.task-actions { display: flex; justify-content: space-between; gap: 18px; padding-top: 32px; margin-top: 32px; border-top: 1px solid var(--line); }

.results-shell { min-height: 100vh; padding-bottom: 80px; background: radial-gradient(circle at 75% 8%, rgba(224,169,76,.08), transparent 25%), var(--ink); }
.report-hero, .summary-pair, .score-overview, .detail-grid, .method-note, .report-footer, .critical-banner { width: min(1160px, calc(100% - 44px)); margin-left: auto; margin-right: auto; }
.report-hero { padding: 70px 0 48px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); }
.report-hero h1 { font-size: clamp(46px, 6vw, 72px); margin: 0 0 10px; }
.report-hero > div > p:not(.eyebrow) { color: var(--muted); }
.report-tags { display: flex; flex-wrap: wrap; gap: 8px; }
.report-tags span { border: 1px solid rgba(224,169,76,.38); color: var(--amber-soft); padding: 7px 10px; font-size: 11px; }
.report-tags .warning-tag { border-color: rgba(242,120,75,.55); color: #ffb39a; }
.score-ring { --score: 0deg; width: 154px; height: 154px; border-radius: 50%; background: conic-gradient(var(--amber) var(--score), #252d3c 0); display: grid; place-items: center; position: relative; flex: 0 0 auto; }
.score-ring:after { content: ""; position: absolute; inset: 9px; border-radius: 50%; background: var(--ink); }
.score-ring > div { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; }
.score-ring strong { font: 500 48px/1 Georgia, serif; }
.score-ring span { color: var(--muted); font-size: 10px; }
.score-ring.small { width: 72px; height: 72px; }
.score-ring.small:after { inset: 5px; background: var(--panel); }
.score-ring.small strong { font-size: 24px; }
.score-ring.small span { font-size: 8px; }
.critical-banner { margin-top: 28px; padding: 20px 24px; border: 1px solid rgba(242,120,75,.5); background: rgba(242,120,75,.09); display: grid; grid-template-columns: 220px 1fr; gap: 20px; }
.critical-banner strong { color: #ffb39a; }
.critical-banner p { margin: 0; color: #d5c3bd; line-height: 1.6; font-size: 13px; }
.summary-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; padding: 32px 0; }
.summary-card { padding: 28px; background: var(--panel); border: 1px solid var(--line); border-top: 3px solid; }
.summary-card.good { border-top-color: var(--mint); }
.summary-card.focus { border-top-color: var(--coral); }
.summary-card h2 { font-size: 34px; margin: 0 0 7px; }
.summary-card > strong { color: var(--amber-soft); font-size: 12px; }
.summary-card > p:last-child { color: var(--muted); margin: 15px 0 0; line-height: 1.6; font-size: 13px; }
.score-overview { background: var(--paper); color: #222632; padding: clamp(26px, 4vw, 46px); }
.section-heading { display: grid; grid-template-columns: 1fr .7fr; gap: 40px; align-items: end; border-bottom: 1px solid #cdc5b8; padding-bottom: 26px; }
.section-heading .eyebrow { color: #706b64; }
.section-heading h2 { font-size: 36px; margin: 0; }
.section-heading > p { color: #64605a; margin: 0; line-height: 1.6; font-size: 13px; }
.bar-list { padding-top: 26px; display: grid; gap: 22px; }
.bar-row { display: grid; grid-template-columns: 190px 1fr 42px 140px; gap: 18px; align-items: center; }
.bar-row > div:first-child { display: flex; flex-direction: column; }
.bar-row > div:first-child span { color: #77716a; font-size: 11px; margin-top: 4px; }
.bar-track { height: 7px; background: #d9d2c7; }
.bar-track span { display: block; height: 100%; background: #bc8730; }
.bar-row b { font: 500 24px Georgia, serif; }
.bar-row em { font-style: normal; color: #6b6358; }
.detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; padding-top: 32px; }
.detail-card { background: var(--panel); border: 1px solid var(--line); padding: 28px; }
.detail-head { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: center; }
.detail-head > span { color: var(--amber); font: 10px ui-monospace, monospace; align-self: start; padding-top: 5px; }
.detail-head h3 { font-size: 30px; margin: 0 0 5px; }
.detail-head p { color: var(--muted); font-size: 11px; line-height: 1.5; margin: 0; }
.band-line { margin: 22px 0; padding: 12px 0; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; font-size: 11px; }
.band-line span { color: var(--muted); }
.band-line strong { color: var(--amber-soft); }
.feedback-block { margin-top: 18px; }
.feedback-block h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--mint); }
.feedback-block.improve h4 { color: var(--coral); }
.feedback-block ul { margin: 0; padding-left: 17px; color: #c5cad4; font-size: 12px; line-height: 1.65; }
.feedback-block li { margin-bottom: 6px; }
.method-note { margin-top: 32px; border: 1px solid rgba(224,169,76,.28); padding: 28px; display: grid; grid-template-columns: .7fr 1.3fr; gap: 50px; }
.method-note h2 { font-size: 30px; margin: 0; }
.method-note > p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.7; }
.report-footer { margin-top: 32px; padding-top: 26px; border-top: 1px solid var(--line); display: flex; gap: 40px; justify-content: space-between; align-items: center; }
.report-footer > p { max-width: 700px; color: var(--muted); font-size: 11px; line-height: 1.6; margin: 0; }
.report-footer > div { display: flex; gap: 10px; }

@media (max-width: 980px) {
  .hero { grid-template-columns: 1fr; }
  .workbench { grid-template-columns: 1fr; }
  .source-pack { position: static; }
  .source-body { min-height: 0; }
  .stage-nav em { display: none; }
  .stage-nav { max-width: 480px; }
  .critical-banner { grid-template-columns: 1fr; }
}

@media (max-width: 720px) {
  .brandbar, .test-header { min-height: 66px; padding: 0 18px; }
  .brand em, .round-label { display: none; }
  .progress-track { top: 66px; }
  .hero { width: min(100% - 32px, 600px); padding-top: 48px; }
  .hero-copy h1 { font-size: 45px; }
  .hero-stats { gap: 24px; }
  .hero-stats strong { font-size: 27px; }
  .form-grid { grid-template-columns: 1fr; }
  .form-grid .full { grid-column: auto; }
  .four-d-strip { grid-template-columns: 1fr 1fr; padding: 0 16px 16px; }
  .four-d-strip div:nth-child(3) { border-left: 1px solid var(--line); }
  .stage-nav { padding: 18px 18px 4px; }
  .workbench { padding: 16px 16px 50px; }
  .task-panel { padding: 24px 18px; }
  .task-panel > h1 { font-size: 38px; }
  .allocation-item { grid-template-columns: 1fr; }
  .segmented { min-width: 0; }
  .radio-cards { grid-template-columns: 1fr; }
  .task-actions { flex-direction: column-reverse; }
  .task-actions button { width: 100%; }
  .report-hero { align-items: flex-start; gap: 25px; }
  .score-ring { width: 108px; height: 108px; }
  .score-ring strong { font-size: 36px; }
  .summary-pair, .detail-grid { grid-template-columns: 1fr; }
  .section-heading, .method-note { grid-template-columns: 1fr; gap: 16px; }
  .bar-row { grid-template-columns: 1fr 40px; gap: 8px 14px; }
  .bar-track { grid-column: 1; grid-row: 2; }
  .bar-row b { grid-column: 2; grid-row: 1; }
  .bar-row em { grid-column: 2; grid-row: 2; font-size: 8px; }
  .report-footer { flex-direction: column; align-items: stretch; }
  .report-footer > div { flex-direction: column; }
  .report-footer button { width: 100%; }
}

@media print {
  body { background: #fff; }
  .brandbar, .report-footer div { display: none; }
  .results-shell { background: #fff; color: #111; padding: 0; }
